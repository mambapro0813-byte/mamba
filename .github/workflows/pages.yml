name: Deploy AI Trade Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Hybrid Lead + Decision Maker + AI SDR 2.0
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          seed='<script src="seed_mexico.js"></script>'
          dm='<script src="decision_makers.js"></script>'
          sdr='<script src="sdr2.js"></script>'
          if seed not in s:
              s=s.replace('<script src="app.js"></script>', seed+'<script src="app.js"></script>')
          if dm not in s:
              s=s.replace('</body>', dm+'</body>')
          if sdr not in s:
              s=s.replace('</body>', sdr+'</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
