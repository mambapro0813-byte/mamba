name: Deploy AI Trade Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -name '*.js' -print0)
      - name: Build one strict AI TRADE desktop shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html','mobile.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              old_scripts=[
                'desktop_ui_v3.js','desktop_ui_v4.js','desktop_ui_v5.js','desktop_ui_v6_simplified.js',
                'desktop_ui_v4_bridge.js','desktop_ui_v4_single_shell.js','stable_dashboard.js','primary_dashboard_v2.js',
                'primary_dashboard_cleanup.js','unified_page_shell.js','unified_page_shell_v2.js','production_functional_completion.js','sales_action_center_v2.js','crm_automation2.js','google_pubsub_production_v2.js'
              ]
              for f in old_scripts:
                  s=re.sub(r'<script\s+src=["\']'+re.escape(f)+r'(?:\?[^"\']*)?["\']\s*></script>','',s)
              early='<style id="primary-shell-boot">@media(min-width:901px){body>.app,#legacyAppV3,#aitradeV3,#aitradeV4,#aiTradeV5,#stableShell{display:none!important}}</style>'
              if 'id="primary-shell-boot"' not in s:
                  s=s.replace('</head>',early+'</head>')
              seed='<script src="seed_mexico.js"></script>'; dm='<script src="decision_makers.js"></script>'; enrich='<script src="decision_enrichment2.js"></script>'; enrich3='<script src="decision_enrichment3.js"></script>'; sdr='<script src="sdr2.js"></script>'; gmail='<script src="gmail_bridge.js"></script>'; mailx='<script src="mail_execution_engine.js"></script>'; gmailoauth='<script src="gmail_oauth_ui.js"></script>'; googlesetup='<script src="google_production_setup.js"></script>'; googleprod='<script src="google_pubsub_production_v2.js?v=20260913-google-prod-1"></script>'; launch='<script src="final_production_launch_center.js"></script>'; firstrun='<script src="first_run_wizard.js"></script>'; listener='<script src="inbox_listener2.js"></script>'; inbox3='<script src="ai_inbox3.js"></script>'; ghistory='<script src="gmail_history_ui.js?v=20260913-mailfix-4"></script>'; pricing='<script src="pricing_brain.js"></script>'; pricing_ui='<script src="pricing_ui.js"></script>'; crm2='<script src="crm_followup2.js"></script>'; command='<script src="command_center.js"></script>'; feedback='<script src="feedback_brain2.js"></script>'; orchestrator='<script src="automation_orchestrator.js"></script>'; agentcc='<script src="agent_control_center.js"></script>'; revenue='<script src="revenue_intelligence.js"></script>'; goal='<script src="goal_engine.js"></script>'; goalgap='<script src="goal_gap_orchestrator.js"></script>'; execution='<script src="sales_execution_pack.js"></script>'; autoleads='<script src="autonomous_lead_acquisition2.js"></script>'; salesloop='<script src="autonomous_sales_loop_ui.js"></script>'; ceobrief='<script src="ceo_daily_brief.js"></script>'; selfheal='<script src="self_healing_ui.js"></script>'; learning='<script src="learning_engine3.js"></script>'; opportunity='<script src="product_opportunity_brain.js"></script>'; activation='<script src="data_activation_center.js"></script>'; bootstrap='<script src="real_production_bootstrap.js"></script>'; health='<script src="health_monitor.js"></script>'; dispatcher='<script src="background_worker_dispatcher_ui.js"></script>'; alerts='<script src="alert_notification_center.js"></script>'; pat='<script src="production_acceptance_test.js"></script>'; mobilehub='<script src="mobile_tools_hub.js"></script>'; cfg_tag='<script src="cloud-config.js?v=20260913-mailfix-4"></script>'; cloud='<script src="cloud_sync.js?v=20260913-mailfix-4"></script>'; primary='<script src="primary_dashboard_v2.js?v=20260913-strict-8"></script>'; cleanup='<script src="primary_dashboard_cleanup.js?v=20260913-cleanup-6"></script>'; action='<script src="sales_action_center_v2.js?v=20260913-action-4"></script>'; crm_auto='<script src="crm_automation2.js?v=20260913-crm-auto-2"></script>'; unified='<script src="unified_page_shell_v2.js?v=20260913-unified-5"></script>'; completion='<script src="production_functional_completion.js?v=20260913-pfc-4"></script>'
              if name=='index.html':
                  if seed not in s:
                      s=s.replace('<script src="app.js"></script>', seed+'<script src="app.js"></script>')
                  tags=[dm,enrich,enrich3,sdr,gmail,mailx,gmailoauth,googlesetup,launch,firstrun,listener,inbox3,ghistory,pricing,pricing_ui,crm2,command,feedback,orchestrator,agentcc,revenue,goal,goalgap,execution,autoleads,salesloop,ceobrief,selfheal,learning,opportunity,activation,bootstrap,health,dispatcher,alerts,pat]
              else:
                  tags=[mailx,gmailoauth,googlesetup,launch,firstrun,enrich,enrich3,inbox3,ghistory,pricing,crm2,command,feedback,orchestrator,agentcc,revenue,goal,goalgap,execution,autoleads,salesloop,ceobrief,selfheal,learning,opportunity,activation,bootstrap,health,dispatcher,alerts,pat,mobilehub]
              # Cloud config/auth must load before Gmail inbox code so both use the same authenticated client/session.
              for tag in [cfg_tag,cloud]:
                  if tag not in s:
                      s=s.replace('</body>',tag+'</body>')
              for tag in tags:
                  if tag not in s:
                      s=s.replace('</body>',tag+'</body>')
              if name=='index.html':
                  s=s.replace('</body>',primary+cleanup+action+crm_auto+unified+completion+googleprod+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate deployed entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      src = dict(attrs).get('src')
                      if src:
                          self.sources.append(src.split('?', 1)[0])

          for page in ('index.html', 'mobile.html'):
              parser = Scripts()
              parser.feed(Path(page).read_text(encoding='utf-8'))
              missing = [src for src in parser.sources if not Path(src).is_file()]
              if missing:
                  raise SystemExit(f'{page}: missing scripts: {missing}')

          required = {
              'index.html': {
                  'primary_dashboard_v2.js',
                  'primary_dashboard_cleanup.js',
                  'unified_page_shell_v2.js',
                  'crm_automation2.js',
                  'gmail_history_ui.js',
              }
          }
          for page, expected in required.items():
              parser = Scripts()
              parser.feed(Path(page).read_text(encoding='utf-8'))
              absent = sorted(expected - set(parser.sources))
              if absent:
                  raise SystemExit(f'{page}: production modules not loaded: {absent}')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
