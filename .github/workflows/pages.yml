name: Deploy AI Trade Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject AI TRADE engines and cloud configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','mobile.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              seed='<script src="seed_mexico.js"></script>'; dm='<script src="decision_makers.js"></script>'; sdr='<script src="sdr2.js"></script>'; gmail='<script src="gmail_bridge.js"></script>'; listener='<script src="inbox_listener2.js"></script>'; pricing='<script src="pricing_brain.js"></script>'; pricing_ui='<script src="pricing_ui.js"></script>'; crm2='<script src="crm_followup2.js"></script>'; command='<script src="command_center.js"></script>'; feedback='<script src="feedback_brain2.js"></script>'; orchestrator='<script src="automation_orchestrator.js"></script>'; agentcc='<script src="agent_control_center.js"></script>'; cfg_tag='<script src="cloud-config.js"></script>'; cloud='<script src="cloud_sync.js"></script>'
              if name=='index.html':
                  if seed not in s: s=s.replace('<script src="app.js"></script>', seed+'<script src="app.js"></script>')
                  tags=[dm,sdr,gmail,listener,pricing,pricing_ui,crm2,command,feedback,orchestrator,agentcc]
              else: tags=[pricing,crm2,command,feedback,orchestrator,agentcc]
              for tag in tags:
                  if tag not in s: s=s.replace('</body>', tag+'</body>')
              for tag in [cfg_tag,cloud]:
                  if tag not in s: s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
