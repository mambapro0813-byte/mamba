name: Deploy AI Trade Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject AI TRADE engines and cloud configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','mobile.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              seed='<script src="seed_mexico.js"></script>'; dm='<script src="decision_makers.js"></script>'; enrich='<script src="decision_enrichment2.js"></script>'; enrich3='<script src="decision_enrichment3.js"></script>'; sdr='<script src="sdr2.js"></script>'; gmail='<script src="gmail_bridge.js"></script>'; mailx='<script src="mail_execution_engine.js"></script>'; gmailoauth='<script src="gmail_oauth_ui.js"></script>'; googlesetup='<script src="google_production_setup.js"></script>'; launch='<script src="final_production_launch_center.js"></script>'; firstrun='<script src="first_run_wizard.js"></script>'; listener='<script src="inbox_listener2.js"></script>'; inbox3='<script src="ai_inbox3.js"></script>'; ghistory='<script src="gmail_history_ui.js"></script>'; pricing='<script src="pricing_brain.js"></script>'; pricing_ui='<script src="pricing_ui.js"></script>'; crm2='<script src="crm_followup2.js"></script>'; command='<script src="command_center.js"></script>'; feedback='<script src="feedback_brain2.js"></script>'; orchestrator='<script src="automation_orchestrator.js"></script>'; agentcc='<script src="agent_control_center.js"></script>'; revenue='<script src="revenue_intelligence.js"></script>'; goal='<script src="goal_engine.js"></script>'; goalgap='<script src="goal_gap_orchestrator.js"></script>'; execution='<script src="sales_execution_pack.js"></script>'; autoleads='<script src="autonomous_lead_acquisition2.js"></script>'; salesloop='<script src="autonomous_sales_loop_ui.js"></script>'; ceobrief='<script src="ceo_daily_brief.js"></script>'; selfheal='<script src="self_healing_ui.js"></script>'; learning='<script src="learning_engine3.js"></script>'; opportunity='<script src="product_opportunity_brain.js"></script>'; activation='<script src="data_activation_center.js"></script>'; bootstrap='<script src="real_production_bootstrap.js"></script>'; health='<script src="health_monitor.js"></script>'; dispatcher='<script src="background_worker_dispatcher_ui.js"></script>'; alerts='<script src="alert_notification_center.js"></script>'; pat='<script src="production_acceptance_test.js"></script>'; mobilehub='<script src="mobile_tools_hub.js"></script>'; cfg_tag='<script src="cloud-config.js"></script>'; cloud='<script src="cloud_sync.js"></script>'
              if name=='index.html':
                  if seed not in s: s=s.replace('<script src="app.js"></script>', seed+'<script src="app.js"></script>')
                  tags=[dm,enrich,enrich3,sdr,gmail,mailx,gmailoauth,googlesetup,launch,firstrun,listener,inbox3,ghistory,pricing,pricing_ui,crm2,command,feedback,orchestrator,agentcc,revenue,goal,goalgap,execution,autoleads,salesloop,ceobrief,selfheal,learning,opportunity,activation,bootstrap,health,dispatcher,alerts,pat]
              else:
                  tags=[mailx,gmailoauth,googlesetup,launch,firstrun,enrich,enrich3,inbox3,ghistory,pricing,crm2,command,feedback,orchestrator,agentcc,revenue,goal,goalgap,execution,autoleads,salesloop,ceobrief,selfheal,learning,opportunity,activation,bootstrap,health,dispatcher,alerts,pat,mobilehub]
              for tag in tags:
                  if tag not in s: s=s.replace('</body>', tag+'</body>')
              for tag in [cfg_tag,cloud]:
                  if tag not in s: s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
