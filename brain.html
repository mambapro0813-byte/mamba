<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TRADE · 产品销售画像与客户匹配</title><style>:root{--b:#2764dc;--g:#159668;--bg:#f5f7fb;--line:#e4e9f1;--text:#172033;--muted:#748096}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.top h1{margin:0;font-size:26px}.top p{color:var(--muted);font-size:12px}.badge{background:#172033;color:#fff;padding:8px 12px;border-radius:999px;font-size:10px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.tabs button.active{background:var(--b);color:#fff;border-color:var(--b)}.page{display:none}.page.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.kpi small{color:var(--muted);font-size:10px}.kpi b{display:block;font-size:24px;margin-top:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.input{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}.wide{min-width:300px}table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}th{background:#fafbfd;color:#667085}.tag{display:inline-block;background:#eef3fb;padding:3px 7px;border-radius:999px;margin:1px;font-size:9px}.ok{background:#eaf8f1;color:#137a55}.warn{background:#fff7e8;color:#9b6519}.btn{border:1px solid var(--b);background:var(--b);color:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:11px}.ghost{background:#fff;color:var(--b)}dialog{border:0;border-radius:16px;width:min(980px,94vw);padding:0;box-shadow:0 25px 80px rgba(20,30,50,.25)}dialog::backdrop{background:rgba(20,30,45,.35)}.modal{padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.muted{color:var(--muted)}@media(max-width:950px){.grid4,.two{grid-template-columns:1fr 1fr}}@media(max-width:650px){main{padding:14px}.grid4,.two{grid-template-columns:1fr}.wide{min-width:100%}}</style></head><body><main><div class="top"><div><h1>Product Brain 2.0 × Customer Brain 1.0</h1><p>将全部耳机SKU转成AI销售画像，并根据客户国家、渠道、需求与购买信号自动匹配产品。</p></div><div class="badge">AI销售画像版</div></div><div class="tabs"><button class="active" data-p="products">产品销售画像</button><button data-p="customers">客户智能匹配</button></div><section id="products" class="page active"><div class="grid4" id="pkpi"></div><div class="toolbar"><input id="q" class="input wide" placeholder="搜索型号/类别/芯片/市场" oninput="renderProducts()"><select id="cat" class="input" onchange="renderProducts()"><option value="">全部类别</option></select></div><table><thead><tr><th>型号</th><th>类别</th><th>报价</th><th>核心卖点</th><th>目标客户</th><th>优先市场</th><th>销售机会分</th><th>动作</th></tr></thead><tbody id="prows"></tbody></table></section><section id="customers" class="page"><div class="grid4" id="ckpi"></div><div class="toolbar"><button class="btn" onclick="addCustomer()">+ 新增客户</button><input id="cq" class="input wide" placeholder="搜索公司/国家/渠道/需求" oninput="renderCustomers()"></div><table><thead><tr><th>客户</th><th>国家/渠道</th><th>联系人</th><th>客户需求</th><th>购买信号</th><th>Top 3 推荐产品</th><th>Next Best Action</th><th>动作</th></tr></thead><tbody id="crows"></tbody></table></section></main><dialog id="pd"><div class="modal"><div class="top"><div><h1 id="pt"></h1><p>AI销售画像</p></div><button class="btn ghost" onclick="pd.close()">关闭</button></div><div id="pbody"></div></div></dialog><script>let PRODUCTS=[];const KEY='aitrade_customer_brain_v1';let customers=JSON.parse(localStorage.getItem(KEY)||'[]');function save(){localStorage.setItem(KEY,JSON.stringify(customers));renderCustomers()}function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function catKey(p){let s=((p.category||'')+' '+(p.catalog?.category||'')+' '+(p.model||'')).toLowerCase();if(s.includes('商务')||s.includes('business')||s.includes('单耳')||s.includes('520')||s.includes('530')||s.includes('525'))return'business';if(s.includes('运动')||s.includes('sport')||s.includes('q63')||s.includes('580')||s.includes('635'))return'sport';if(s.includes('夹耳')||s.includes('clip'))return'clip';if(s.includes('挂耳')||s.includes('open')||s.includes('ows'))return'open';if(s.includes('彩屏')||s.includes('lcd')||s.includes('anc'))return'lcd';return'tws'}function profile(p){let map={lcd:{targets:['电商卖家','消费电子经销商','潮流数码品牌'],markets:['墨西哥','巴西','南非','东南亚'],points:['彩屏充电仓','高视觉卖点','适合短视频/电商展示'],pitch:'突出彩屏交互、外观差异化与OEM包装，适合电商快速上新。'},open:{targets:['运动/户外品牌','眼镜人群渠道','消费电子经销商'],markets:['墨西哥','巴西','南非','美国'],points:['开放式佩戴','长时间舒适','不堵耳'],pitch:'强调开放式舒适、通勤/运动场景和OEM/ODM能力。'},clip:{targets:['年轻消费品牌','女性/时尚渠道','电商卖家'],markets:['墨西哥','巴西','东南亚','南非'],points:['轻量夹耳','时尚佩戴','差异化造型'],pitch:'强调轻量佩戴、造型差异和社媒传播潜力。'},sport:{targets:['运动用品渠道','户外电商品牌','消费电子经销商'],markets:['墨西哥','南非','巴西','美国'],points:['长续航','稳固佩戴','运动场景'],pitch:'强调长续航、运动稳定性和户外场景。'},business:{targets:['办公设备经销商','呼叫中心供应商','企业采购'],markets:['美国','墨西哥','欧洲','中东'],points:['通话场景','单耳商务','长待机'],pitch:'强调通话效率、长待机和企业/办公应用。'},tws:{targets:['消费电子经销商','零售连锁','Amazon/Mercado Libre卖家'],markets:['墨西哥','巴西','南非','东南亚'],points:['成熟TWS形态','价格竞争力','OEM/ODM'],pitch:'强调稳定供货、价格梯度和私牌定制。'}};let a=map[catKey(p)],price=+p.cost||99,complete=['model','category','price','bt','chip','play','color','package','carton'].filter(k=>p[k]).length/9*100,score=Math.min(98,Math.round(58+complete*.25+(price<=35?8:price<=50?4:0)+(catKey(p)==='open'?5:0)));return{...a,score,value:price<=35?'价格竞争力强':price<=50?'主流价格带':'偏中高价位'}}function fit(c,p){let sp=profile(p),score=Math.round(sp.score*.2),country=(c.country||'').toLowerCase(),channel=(c.channel||'').toLowerCase(),need=(c.need||'').toLowerCase();if(sp.markets.some(x=>country.includes(x.toLowerCase())))score+=30;if(sp.targets.some(x=>channel.includes(x.toLowerCase())||need.includes(x.toLowerCase())))score+=25;if(need.includes((p.model||'').toLowerCase()))score+=25;return Math.min(100,score)}function best(c){return PRODUCTS.map(p=>({p,s:fit(c,p)})).sort((a,b)=>b.s-a.s).slice(0,3)}function renderProducts(){let q=(document.getElementById('q').value||'').toLowerCase(),c=document.getElementById('cat').value;let arr=PRODUCTS.filter(p=>(!c||p.category===c)&&JSON.stringify(p).toLowerCase().includes(q));prows.innerHTML=arr.map(p=>{let sp=profile(p);return`<tr><td><b>${esc(p.model)}</b><br><span class="muted">${esc(p.bt||'')} ${esc(p.chip||'')}</span></td><td>${esc(p.category||'-')}</td><td>${esc(p.price||'-')}</td><td>${sp.points.map(x=>`<span class="tag">${x}</span>`).join('')}</td><td>${sp.targets.slice(0,2).join('<br>')}</td><td>${sp.markets.slice(0,3).map(x=>`<span class="tag ok">${x}</span>`).join('')}</td><td><b>${sp.score}</b><br><span class="muted">${sp.value}</span></td><td><button class="btn ghost" onclick="showProduct(${PRODUCTS.indexOf(p)})">详情</button></td></tr>`}).join('');}function showProduct(i){let p=PRODUCTS[i],sp=profile(p);pt.textContent=p.model;pbody.innerHTML=`<div class="two"><div class="card"><b>产品技术与商业数据</b><p>报价：${esc(p.price||'-')} · MOQ：${p.moq||1000}</p><p>BT：${esc(p.bt||'-')} · 芯片：${esc(p.chip||'-')}</p><p>播放：${esc(p.play||'-')} · 待机：${esc(p.standby||'-')}</p><p>颜色：${esc(p.color||'-')}</p><p>包装：${esc(p.package||'-')}</p><p>${(p.certs||['CE','FCC','RoHS','UN38.3','MSDS']).map(x=>`<span class="tag ok">${x}</span>`).join(' ')}</p></div><div class="card"><b>AI销售画像</b><p><b>目标客户：</b>${sp.targets.join(' / ')}</p><p><b>优先市场：</b>${sp.markets.join(' / ')}</p><p><b>核心卖点：</b>${sp.points.join(' · ')}</p><p><b>价格定位：</b>${sp.value}</p><p><b>开发策略：</b>${sp.pitch}</p><p><b>AI销售机会分：</b>${sp.score}/100</p></div></div>`;pd.showModal()}function addCustomer(){let company=prompt('公司名称');if(!company)return;let country=prompt('国家','墨西哥')||'';let channel=prompt('渠道/客户类型','Distributor')||'';let contact=prompt('联系人/职位','')||'';let need=prompt('主营产品/产品缺口/需求','')||'';customers.push({id:Date.now(),company,country,channel,contact,need,signals:[]});save()}function addSignal(id){let c=customers.find(x=>x.id===id),s=prompt('购买信号：回复 / RFQ / 查看报价 / 下载Catalog / 样品 / 会议 / 复购');if(!s)return;c.signals.push(s);save()}function nba(c){let n=c.signals.length;if(c.signals.includes('RFQ')||c.signals.includes('会议')||n>=4)return'人工介入：报价/谈判';if(c.signals.includes('样品')||n>=2)return'生成报价或样品方案';if(n)return'D3/D7跟进';return'AI SDR首次开发'}function renderCustomers(){let q=(document.getElementById('cq').value||'').toLowerCase(),arr=customers.filter(c=>JSON.stringify(c).toLowerCase().includes(q));crows.innerHTML=arr.map(c=>`<tr><td><b>${esc(c.company)}</b></td><td>${esc(c.country)}<br><span class="tag">${esc(c.channel)}</span></td><td>${esc(c.contact||'-')}</td><td>${esc(c.need||'-')}</td><td>${c.signals.map(x=>`<span class="tag ok">${esc(x)}</span>`).join(' ')||'-'}</td><td>${best(c).map(x=>`<span class="tag ${x.s>=70?'ok':''}">${esc(x.p.model)} ${x.s}</span>`).join(' ')}</td><td>${nba(c)}</td><td><button class="btn" onclick="addSignal(${c.id})">+信号</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">暂无客户，点击“新增客户”开始Customer Brain匹配。</td></tr>';ckpi.innerHTML=[['客户数',customers.length],['有购买信号',customers.filter(x=>x.signals.length).length],['高意向客户',customers.filter(x=>x.signals.includes('RFQ')||x.signals.length>=4).length],['已建立产品匹配',customers.length?customers.length:0]].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.p).classList.add('active')});fetch('index.html').then(r=>r.text()).then(t=>{let m=t.match(/const PRODUCTS=(\[.*?\]);\nconst CERTS=/s);if(!m)throw new Error('未找到产品数据');PRODUCTS=JSON.parse(m[1]);let cats=[...new Set(PRODUCTS.map(x=>x.category).filter(Boolean))];cats.forEach(c=>cat.add(new Option(c,c)));let avg=Math.round(PRODUCTS.reduce((a,p)=>a+profile(p).score,0)/PRODUCTS.length);pkpi.innerHTML=[['全部SKU',PRODUCTS.length],['统一认证','CE/FCC/RoHS/UN38.3/MSDS'],['平均销售机会分',avg],['已生成销售画像',PRODUCTS.length]].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');renderProducts();renderCustomers()}).catch(e=>{prows.innerHTML=`<tr><td colspan="8">加载产品数据失败：${esc(e.message)}</td></tr>`});</script></body></html>
